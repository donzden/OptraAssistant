services:
  - type: web
    name: optra-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && node_modules/.bin/prisma generate && npm run build
    startCommand: node_modules/.bin/prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://optra-frontend.onrender.com
      - key: ENGINE_URL
        value: https://optra-engine.onrender.com
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: KITE_REDIRECT_URI
        value: https://optra-api.onrender.com/api/v1/kite/callback
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: optra-engine
    runtime: python
    plan: free
    rootDir: engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false

  - type: web
    name: optra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://optra-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
